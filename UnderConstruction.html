<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aroa Martín — Under Construction</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream : #F4F0EB;
      --black : #0E0D0B;
      --gray  : #5A5550;
      --red   : #9E2210;
    }
    html, body { width:100%; height:100%; overflow:hidden; background:var(--cream); font-family:'Jost',sans-serif; }
    #gl-canvas { position:fixed; top:0; left:0; width:100%; height:100%; display:block; z-index:0; }

    .nav-top {
      position:fixed; top:0; left:0; right:0; z-index:100; height:48px;
      display:flex; align-items:center; padding:0 32px;
      background:rgba(244,240,235,.82);
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    }
    .nav-top .side-left, .nav-top .side-right { display:flex; align-items:center; gap:12px; flex-shrink:0; }
    .nav-bottom {
      position:fixed; bottom:0; left:0; right:0; z-index:100; height:48px;
      display:flex; align-items:center; padding:0 32px;
      background:rgba(244,240,235,.82);
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    }
    .nav-bottom .side-left { display:flex; align-items:center; gap:12px; flex-shrink:0; }
    .line-center { flex:1; height:1px; background:var(--black); }
    .nav-num { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:9px; color:var(--red); line-height:1; }
    .nav-link { font-size:9px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:var(--black); text-decoration:none; transition:color .25s,letter-spacing .3s; }
    .nav-link:hover { color:var(--red); letter-spacing:.28em; }

    #center-text {
      position:fixed; top:50%; left:50%;
      transform:translate(-50%,-50%);
      pointer-events:none; z-index:10;
      text-align:center; user-select:none;
      animation: fadeUp 1.8s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translate(-50%,calc(-50% + 22px)); }
      to   { opacity:1; transform:translate(-50%,-50%); }
    }
    #center-text .name {
      display:block; font-family:'Jost',sans-serif; font-size:8px;
      font-weight:500; letter-spacing:.38em; text-transform:uppercase;
      color:var(--gray); margin-bottom:18px;
    }
    #center-text .rule {
      display:block; width:28px; height:1px;
      background:var(--red); margin:0 auto 20px;
    }
    #center-text .t1 {
      display:block; font-family:'Cormorant Garamond',serif;
      font-style:italic; font-weight:300;
      font-size:clamp(36px,5vw,68px); line-height:1;
      color:var(--black); letter-spacing:.16em;
    }
    #center-text .t2 {
      display:block; font-family:'Cormorant Garamond',serif;
      font-style:italic; font-weight:400;
      font-size:clamp(50px,7.5vw,108px); line-height:.92;
      color:var(--black); letter-spacing:-.01em;
    }
    #center-text .url {
      display:block; font-family:'Jost',sans-serif; font-size:9px;
      font-weight:400; letter-spacing:.22em; text-transform:uppercase;
      color:var(--black); opacity:.35; margin-top:22px;
    }
    @media(max-width:640px){ .nav-top,.nav-bottom{padding:0 20px;} }
    @media(prefers-reduced-motion:reduce){ #center-text{animation:none;} }
  </style>
</head>
<body>

  <canvas id="gl-canvas"></canvas>

  <nav class="nav-top">
    <div class="side-left">
      <span class="nav-num">(1)</span>
      <a href="index.html#about" class="nav-link">Who is she?</a>
    </div>
    <div class="line-center"></div>
    <div class="side-right">
      <a href="index.html#work" class="nav-link">What she do?</a>
      <span class="nav-num">(2)</span>
    </div>
  </nav>

  <div id="center-text">
    <span class="name">Aroa Martín</span>
    <span class="rule" aria-hidden="true"></span>
    <span class="t1">Under</span>
    <span class="t2">Construction</span>
    <span class="url">aroaml.github.io</span>
  </div>

  <nav class="nav-bottom">
    <div class="side-left">
      <span class="nav-num">(3)</span>
      <a href="contact.html" class="nav-link">Contact</a>
    </div>
    <div class="line-center"></div>
  </nav>

  <script>
    'use strict';

    const canvas = document.getElementById('gl-canvas');
    const gl = canvas.getContext('webgl');
    if (!gl) { document.body.style.background = '#F4F0EB'; }

    const prefersReduced = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

    let W, H;
    let mouse = { x: 0.5, y: 0.5 };

    function resize() {
      W = canvas.offsetWidth; H = canvas.offsetHeight;
      canvas.width = W; canvas.height = H;
      gl.viewport(0, 0, W, H);
    }
    resize();
    window.addEventListener('resize', resize);

    /* ── VERTEX SHADER ───────────────────────────────── */
    const VS = `
      attribute vec2 a_pos;
      void main(){ gl_Position = vec4(a_pos,0,1); }
    `;

    /* ── FRAGMENT SHADER ─────────────────────────────── */
    const FS = `
      precision highp float;
      uniform vec2  u_res;
      uniform float u_time;
      uniform vec2  u_mouse;       /* normalized 0-1, direct position  */
      uniform vec2  u_ripples[12];
      uniform float u_rtimes[12];
      uniform int   u_rcount;

      void main(){
        vec2 uv = gl_FragCoord.xy / u_res;
        uv.y    = 1.0 - uv.y;
        float ar = u_res.x / u_res.y;

        /* ── displacement accumulator ─────────────────
           Scalar applied to both X and Y equally —
           creates isotropic, organic distortion field.
        ─────────────────────────────────────────────── */
        float totalDisp = 0.0;

        /* continuous pulsing wave around cursor position */
        vec2 md   = uv - u_mouse;
        md.x     *= ar;
        float mdist = length(md);
        /* sin travels outward (-u_time) and decays with distance */
        float mouseWave = sin(mdist * 28.0 - u_time * 5.5)
                        * exp(-mdist * 5.5)
                        * 0.011;
        totalDisp += mouseWave;

        /* ripple rings from mousemove + click */
        for (int i = 0; i < 12; i++) {
          if (i >= u_rcount) break;
          float age = u_time - u_rtimes[i];
          if (age < 0.0) continue;
          vec2 d = uv - u_ripples[i];
          d.x   *= ar;
          float dist = length(d);
          float wave = sin(dist * 35.0 - age * 6.5)
                     * exp(-age  * 1.8)
                     * exp(-dist * 4.5);
          totalDisp += wave * 0.013;
        }

        /* ── domain warp (lava lamp) ──────────────────
           Applied to seed coords p before line eval.
           Cursor displacement injected here so it
           steers the organic motion naturally.
        ─────────────────────────────────────────────── */
        vec2 p = uv + vec2(totalDisp);

        float w1y = sin(p.x * 1.10 + u_time * 0.047 + 0.00) * 0.20
                  + sin(p.x * 1.93 - u_time * 0.038 + 2.09) * 0.13
                  + sin(p.x * 0.63 + u_time * 0.029 + 4.31) * 0.15
                  + sin(p.x * 3.17 - u_time * 0.021 + 1.73) * 0.06;
        float w1x = sin(p.y * 1.41 + u_time * 0.034 + 1.22) * 0.08
                  + sin(p.y * 2.31 - u_time * 0.026 + 3.88) * 0.04;

        vec2 p2 = p + vec2(w1x, w1y);

        float w2y = sin(p2.x * 1.57 + u_time * 0.031 + 5.10) * 0.09
                  + sin(p2.x * 0.81 - u_time * 0.024 + 0.67) * 0.07;
        float w2x = sin(p2.y * 1.73 + u_time * 0.028 + 2.44) * 0.04;

        vec2 fuv = p2 + vec2(w2x, w2y);

        /* ── draw lines ───────────────────────────────
           Per-line phase offset (t * k) → each line
           has its own personality within the shared warp.
        ─────────────────────────────────────────────── */
        float cr = 0.957, cg = 0.941, cb = 0.922;
        float lineVal = 0.0, redVal = 0.0;

        for (int li = 0; li < 40; li++) {
          float t     = float(li) / 39.0;
          float baseY = -0.06 + t * 1.12;

          float wY = baseY;
          /* per-line phase variation — the key to organic independence */
          wY += sin(fuv.x * 3.8 + u_time * 0.28 + t * 2.3) * 0.032 * (1.0 - t * 0.3);
          wY += sin(fuv.x * 6.7 - u_time * 0.19 + t * 3.9) * 0.016;
          wY += sin(fuv.x * 1.9 + u_time * 0.13 + t * 1.1) * 0.022;
          wY += sin(fuv.x * 9.2 + u_time * 0.09 + t * 6.1) * 0.005;

          float lw = 0.0006 + t * 0.00014;
          float a  = smoothstep(lw + 0.0011, lw, abs(fuv.y - wY));

          if (li == 10 || li == 27) redVal  += a * 0.60;
          else                      lineVal += a * (0.13 + t * 0.08);
        }

        lineVal = clamp(lineVal, 0.0, 1.0);
        redVal  = clamp(redVal,  0.0, 1.0);

        float r = mix(cr, 0.055, lineVal);
        float g = mix(cg, 0.051, lineVal);
        float b = mix(cb, 0.043, lineVal);
        r = mix(r, 0.620, redVal);
        g = mix(g, 0.133, redVal);
        b = mix(b, 0.063, redVal);

        gl_FragColor = vec4(r, g, b, 1.0);
      }
    `;

    /* ── COMPILE ─────────────────────────────────────── */
    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
        console.error(gl.getShaderInfoLog(s));
      return s;
    }
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog); gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
    const aPos = gl.getAttribLocation(prog, 'a_pos');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

    const uRes    = gl.getUniformLocation(prog, 'u_res');
    const uTime   = gl.getUniformLocation(prog, 'u_time');
    const uMouse  = gl.getUniformLocation(prog, 'u_mouse');
    const uRipPos = gl.getUniformLocation(prog, 'u_ripples');
    const uRTimes = gl.getUniformLocation(prog, 'u_rtimes');
    const uRCount = gl.getUniformLocation(prog, 'u_rcount');

    /* ── RIPPLES ─────────────────────────────────────── */
    const MAX    = 12;
    const rpos   = new Float32Array(MAX * 2);
    const rtimes = new Float32Array(MAX);
    let rhead = 0, rcount = 0;

    function addRipple(mx, my, t) {
      rpos[rhead * 2]     = mx;
      rpos[rhead * 2 + 1] = my;
      rtimes[rhead]       = t;
      rhead = (rhead + 1) % MAX;
      if (rcount < MAX) rcount++;
    }

    /* ── DEVICE DETECTION ───────────────────────────── */
    const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

    /* ── AUTO-PILOT (mobile fallback) ───────────────── */
    /* Lissajous-style slow drift used when no real input is present */
    let autoPilot = false;
    let autoStart = 0;

    function autoMouse(t) {
      const s = t - autoStart;
      mouse.x = 0.5 + Math.sin(s * 0.19) * 0.32 + Math.sin(s * 0.07) * 0.14;
      mouse.y = 0.5 + Math.sin(s * 0.13 + 1.1) * 0.28 + Math.sin(s * 0.09) * 0.12;
    }

    /* ── GYROSCOPE (mobile primary) ──────────────────── */
    let gyroActive = false;

    function setupGyro() {
      if (!window.DeviceOrientationEvent) return;

      function handleOrientation(e) {
        if (e.gamma === null && e.beta === null) return;
        gyroActive = true;
        autoPilot = false;
        /* gamma: left/right tilt -90..90 → x  */
        /* beta:  front/back tilt -180..180 → y */
        const gx = Math.max(-40, Math.min(40, e.gamma || 0));
        const gy = Math.max(-40, Math.min(40, (e.beta  || 0) - 20)); /* -20° neutral offset */
        mouse.x = 0.5 + gx / 80;
        mouse.y = 0.5 + gy / 80;
      }

      /* iOS 13+ requires permission */
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        /* Ask on first tap */
        window.addEventListener('touchstart', function askPerm() {
          DeviceOrientationEvent.requestPermission()
            .then(r => { if (r === 'granted') window.addEventListener('deviceorientation', handleOrientation); })
            .catch(() => {});
          window.removeEventListener('touchstart', askPerm);
        }, { once: true });
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
      }
    }

    if (isTouchDevice) {
      setupGyro();
      /* Start auto-pilot; gyro will disable it if available */
      autoPilot = true;
    }

    /* ── EVENTS ──────────────────────────────────────── */
    let lastRipple = 0;

    window.addEventListener('mousemove', e => {
      autoPilot = false;
      mouse.x = e.clientX / W;
      mouse.y = e.clientY / H;

      if (prefersReduced) return;
      const now = performance.now() / 1000;
      if (now - lastRipple > 0.15) {
        addRipple(mouse.x, mouse.y, now);
        lastRipple = now;
      }
    });

    window.addEventListener('click', e => {
      if (prefersReduced) return;
      const mx  = e.clientX / W;
      const my  = e.clientY / H;
      const now = performance.now() / 1000;
      for (let i = 0; i < 3; i++) {
        addRipple(
          mx + (Math.random() * 0.02 - 0.01),
          my + (Math.random() * 0.02 - 0.01),
          now - i * 0.05
        );
      }
    });

    window.addEventListener('mouseleave', () => {
      if (isTouchDevice) return;
      mouse.x = -2; mouse.y = -2;
    });

    window.addEventListener('touchmove', e => {
      if (!e.touches.length) return;
      autoPilot = false;
      gyroActive = false;
      mouse.x = e.touches[0].clientX / W;
      mouse.y = e.touches[0].clientY / H;
      const now = performance.now() / 1000;
      if (now - lastRipple > 0.15) {
        addRipple(mouse.x, mouse.y, now);
        lastRipple = now;
      }
    }, { passive: true });

    window.addEventListener('touchstart', e => {
      if (!e.touches.length || prefersReduced) return;
      const mx  = e.touches[0].clientX / W;
      const my  = e.touches[0].clientY / H;
      const now = performance.now() / 1000;
      for (let i = 0; i < 3; i++) {
        addRipple(
          mx + (Math.random() * 0.03 - 0.015),
          my + (Math.random() * 0.03 - 0.015),
          now - i * 0.05
        );
      }
    }, { passive: true });

    window.addEventListener('touchend', () => {
      /* Return to gyro or auto-pilot after touch ends */
      if (!gyroActive) { autoPilot = true; autoStart = performance.now() / 1000 - 0; }
    }, { passive: true });

    /* ── LOOP ────────────────────────────────────────── */
    let frozenT = null;

    function loop(ts) {
      const t = prefersReduced
        ? (frozenT ?? (frozenT = ts / 1000))
        : ts / 1000;

      if (autoPilot && !prefersReduced) {
        if (!autoStart) autoStart = t;
        autoMouse(t);
      }

      gl.uniform2f(uRes, W, H);
      gl.uniform1f(uTime, t);
      gl.uniform2f(uMouse, mouse.x, mouse.y);
      gl.uniform2fv(uRipPos, rpos);
      gl.uniform1fv(uRTimes, rtimes);
      gl.uniform1i(uRCount, Math.min(rcount, MAX));
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>

</body>
</html>
